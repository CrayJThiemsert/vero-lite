# vero-lite ontology — fleet_maintenance vertical, v0 (DEMO / guess-and-react).
# 6th vertical — a Thai trucking operator (รถรับจ้าง: หัวลาก + หกล้อ, สายแหลมฉบัง/อีสาน).
# The governed decision = REPAIR SPEND: a truck breaks down and the repair quote lands
# AT/ABOVE the truck's minor-repair ceiling (OCT_RECOMMEND_DIRECTION=above), so the spend
# stops being "ช่างเคาะเอง" and becomes a governed, authority-tiered, separated-from-the-
# requester decision.
#
# Reshape (per the ADR-008 "may extend" precedent + building_materials_v0.yaml): the
# monitored "Asset" is a Truck, the "Site" is a Depot. Mirrors the aquaculture 6-object
# OCT grammar exactly (Asset -> Truck, Site -> Depot), so it scaffolds a Tier-1 Mirror demo.
#
# >>> NUMERIC VALUES HERE ARE GUESSES — "เดา, รอแก้" (guess-and-react) — EXCEPT where a <<<
# >>> property says CONFIRMED and names the design-partner answer that confirmed it.      <<<
# Narrative provenance (PLAN-0086 AC-3): the fleet mix (หัวลากสิบกว่าคัน / หกล้อยี่สิบปลายๆ),
# the GPS stream, the breakdown pain event, and the three-rung approval ladder all come from
# the dirtied customer narrative; the ฿ VALUES come from the customer-question log, never
# from this file's imagination.
# PLAN-0096 Step 1 promoted the FIRST property out of guess-land: minor_repair_ceiling_thb is
# now the real design partner's answer (Q8). PLAN-0096 Step 9 promoted the SECOND: the
# odometer pair behind next_service_due_km is no longer a guess awaiting correction, because
# it now has a LOAD PATH — the Wialon CSV export and the paper PM folder, imported and
# human-confirmed (AC-10; runbook docs/runbooks/fleet-pm-onboarding.md). The fixture values in
# data_adapter/synthetic.py remain demo values, and are labelled DEMO SEED rather than
# `รอแก้`: the correction no longer happens by editing this repository, it happens by
# importing his file. The distinction is the point — a blanket "everything is a guess"
# header, left standing after he has answered, trains him to ignore the correction surface
# (ADR-0032 D1).

version: 0
namespace: fleet_maintenance

object_types:
  Truck:
    primary_key: truck_id
    title_key: plate
    description: A revenue vehicle in the fleet — the managed operational unit (the monitored "Asset").
    properties:
      truck_id:
        type: string
        required: true
      plate:
        type: string
        required: true
      accounting_code:
        type: string
        description: >-
          รหัสรถ — this truck's code in the operator's accounting system (Express today),
          AC-9 column 8 of the month-end export. It lives HERE, in the ontology, rather than
          in an export-side lookup, because the ontology is what the NL-query translate step
          and every future LLM surface reason over: a code held outside it is invisible to
          them, which forfeits the point of having a semantic layer at all (Cray, typed s190).
          Named for the DOMAIN role, not for Express, so a partner who changes accounting
          systems keeps the property and changes the values — but it is deliberately ONE
          scalar, not a system-keyed map: exactly one external system exists today, and a
          map would be an abstraction ahead of pressure (ADR-006) as well as far harder for
          an LLM to filter on than a plain string.
          AUTHORED, never measured — entered once at onboarding. Absent = "no code recorded
          yet", which the export renders as a blank cell and the KPI counts as incomplete.
          It is never guessed.
        synonyms:
          th: [รหัสรถ, รหัสรถในระบบบัญชี]
          en: [accounting code, vehicle code, express vehicle code]
      truck_class:
        type: enum
        # narrative: "รถหัวลากก็มีอยู่สิบกว่าคัน หกล้อก็... น่าจะยี่สิบปลายๆ"
        values: [tractor_head, six_wheeler, trailer]
      odometer_km:
        type: float
        description: Latest odometer reading (km) from the installed GPS/telematics unit ("รถผมติด GPS ไว้แล้วนะ").
      minor_repair_ceiling_thb:
        type: float
        description: >-
          Per-truck ฿ ceiling under which the head mechanic just fixes it and no governed run
          is needed ("ซ่อมนิดหน่อยๆ ผมให้ต้อมเคาะเลย"); a quote AT/ABOVE it breaches into the
          governed ladder — this truck's OWN per-entity band (ADR-016 FKP amendment).
          CONFIRMED by the design partner (Q8, 2026-07-28 discovery round): "ต้อม ~5,000; some
          tractor heads stretch a bit". The `รอแก้` stamp is retired because he answered it
          (PLAN-0096 Step 1). Default 5001 = his inclusive "up to 5,000" under an at/above
          breach; the per-truck STRETCH values are a named partner intake question, so a
          higher ceiling arrives per truck rather than being invented here.
      next_service_due_km:
        type: float
        description: >-
          The ABSOLUTE odometer point at which this truck's next interval service falls due —
          the AT-3 calm path's per-entity band (PLAN-0089), the `reorder_point` analogue.
          Absolute, NOT an interval: the judge compares the projected `measured_value`
          (odometer_km) against this field directly, and the projection grammar is a fields-only
          rename with no arithmetic — there is nowhere to compute `last_service + interval`.
          Computed per truck as `last_service_odometer + 100,000` — the 100,000 km interval is a
          logged customer answer ("เข้าศูนย์ทุกแสนกิโลฯ", PLAN-0089 M-5 Q1). The arithmetic is
          done ONCE, at load, by `verticals/fleet_maintenance/pm_import.py` (PLAN-0096 Step 9):
          the last-service odometer is loaded from the operator's paper PM folder as a documented
          onboarding task and only becomes this value once a human CONFIRMS the imported row
          (AC-10 — Q4 says the telematics figure is approximate, so a machine reading is a claim
          and never a fact). An unconfirmed import is invisible here by construction.
          Distinct from minor_repair_ceiling_thb, which is money-typed and cannot serve a km band.
      status:
        type: enum
        values: [in_service, roadside_breakdown, in_garage, retired]
      site_id:
        type: ref
        target: Depot
        required: true

  Vendor:
    primary_key: vendor_id
    title_key: name
    description: >-
      A garage / parts shop / dealer the fleet buys repairs from — ผู้ขาย / อู่, the commercial
      party a repair invoice comes from. An ADR-008 D1 "may extend" object, the same license
      procurement used to author Supplier at N=1.
      It exists as a first-class object rather than an export-side lookup for the same reason
      Truck.accounting_code does: the LLM reasons over the ontology, so a vendor registry held
      outside it cannot answer "which garage is รหัสผู้ขาย V-07?" (Cray, typed s190).
      Deliberately NOT the same thing as Depot. A Depot is a PLACE — it carries lat/lng, it
      lights the map, and Truck.site_id is a required ref to one, so every truck would have to
      be based at a vendor. Two of Depot's three types (home_yard, roadside_point) are not
      commercial parties at all, so a vendor code hung there would be null by construction for
      most rows.
      **How this reconciles with the free-text `vendor` columns.** `RepairCaseQuote.vendor`,
      `RepairCaseJustification.vendor` and `RepairCaseCloseout.vendor` stay free text on
      purpose — เมย์ types what the paper says, and this registry does not gate her. The export
      resolves a typed name to a row here by the SAME exact, trimmed, case-insensitive match
      `services/db/evidence_pack.py` already uses; fuzzy matching is refused there because it
      would MERGE vendors an operator meant to keep apart, and it is refused here for the same
      reason. A name with no match yields a blank รหัสผู้ขาย and marks that export row
      incomplete — which is a true statement about the data, not a failure to try harder.
    properties:
      vendor_id:
        type: string
        required: true
      name:
        type: string
        required: true
        description: >-
          The garage's name as the operator writes it — the value เมย์ types into a quote or a
          close-out, matched exactly (trimmed, case-insensitively) rather than fuzzily.
        synonyms:
          th: [ผู้ขาย, อู่, ชื่ออู่, ร้านอะไหล่]
          en: [vendor, garage, supplier, workshop]
      accounting_code:
        type: string
        description: >-
          รหัสผู้ขาย — this vendor's code in the operator's accounting system (Express today),
          AC-9 column 6. OPTIONAL by the partner's own marking — he wrote the column as
          "รหัสผู้ขาย (ถ้ามี)", and a new vendor is opened in Express by accounting first, so a
          garage can legitimately be used before it has a code. Absent = blank export cell and
          an incomplete row, never a guessed code.
        synonyms:
          th: [รหัสผู้ขาย, รหัสอู่]
          en: [vendor code, supplier code, express vendor code]

      # --- PROMOTION PATH (PLAN-0117, SD-1 ruled (c)) -----------------------
      # Every authored value below is a placeholder, not a partner answer, and is
      # retired by MEASUREMENT rather than edited by hand. The route is the measured
      # projection (SD-1 option (b)): aggregate the `repair_case_quote`,
      # `repair_case_accepted_quote` and closeout rows, joined to this registry on the
      # free-text `vendor` name by the SAME exact, trimmed, case-insensitive match
      # `services/db/evidence_pack.py` already uses — never fuzzy, which would merge
      # vendors the operator meant to keep apart. That export holds one row today, so
      # the projection cannot stand in for the seed yet. When real volume exists it
      # replaces these values and each property's stamp is deleted with it: a promoted
      # fact retires its stamp, an unanswered one keeps it (the
      # `minor_repair_ceiling_thb` precedent).
      standing:
        type: enum
        values: [approved, probation, suspended]
        description: >-
          Whether this garage is currently cleared to receive work.
          AUTHORED / DEMO SEED, not a partner answer — the intake question that promotes it is
          "อู่ไหนที่ตอนนี้สั่งงานไม่ได้ และเพราะอะไร". Non-required: a garage nobody has assessed
          yet has no standing, which is a real state rather than a missing value.
        synonyms:
          th: [สถานะอู่, สถานะผู้ขาย, อู่ที่ใช้ได้]
          en: [standing, vendor status, approval status]
      is_contracted:
        type: bool
        description: >-
          อู่คู่สัญญา — a garage the operator holds a standing agreement with, rather than one
          used ad hoc.
          AUTHORED / DEMO SEED, not a partner answer; the intake question that promotes it is
          "อู่ไหนเป็นอู่คู่สัญญาบ้าง". Non-required.
        synonyms:
          th: [อู่คู่สัญญา, คู่สัญญา, อู่ประจำ]
          en: [contracted, on contract, contracted garage]
      repairs_completed_count:
        type: int
        description: >-
          ประวัติงานซ่อม — how many repairs this garage has completed for the fleet.
          AUTHORED / DEMO SEED, not a partner answer; promoted by counting closeout rows per
          resolved vendor (see the promotion-path comment above). Non-required — a garage with
          no history yet is a real state, and that row is what keeps any completeness KPI
          non-vacuous.
        synonyms:
          th: [ประวัติงานซ่อม, จำนวนงานที่ซ่อมเสร็จ, งานที่เคยทำ]
          en: [repairs completed, jobs completed, repair history]
      comeback_count:
        type: int
        description: >-
          งานซ่อมซ้ำ — repairs that came back: the same truck returning for the same fault after
          this garage closed it.
          AUTHORED / DEMO SEED, not a partner answer; the intake question is "งานที่ต้องกลับมา
          ซ่อมซ้ำ นับยังไง ภายในกี่วัน" — the window is the operator's to define, and until he
          defines it this figure cannot be projected from the rows at all. Non-required.
        synonyms:
          th: [งานซ่อมซ้ำ, ซ่อมแล้วกลับมาอีก, เคลมซ้ำ]
          en: [comebacks, rework, repeat repairs]
      avg_turnaround_days:
        type: float
        description: >-
          รอบเวลาซ่อมเฉลี่ย — average days from handing the truck over to getting it back.
          AUTHORED / DEMO SEED, not a partner answer; promoted by averaging closeout minus
          hand-over dates per resolved vendor. Non-required.
        synonyms:
          th: [รอบเวลาซ่อมเฉลี่ย, ซ่อมเสร็จเร็วแค่ไหน, เวลาเฉลี่ยต่องาน]
          en: [average turnaround, turnaround days, cycle time]

      # --- dormant band (PLAN-0117, SD-3a ruled) ----------------------------
      # Declared but deliberately UNPOPULATED, and deliberately WITHOUT `synonyms`.
      # Declaring them now means the Ask/translate LLM can use a value the day one
      # exists, with zero code change; leaving synonyms off keeps the per-list prompt
      # cost unpaid until the narrative actually brings the Thai term. These carry NO
      # AUTHORED stamp — nothing is authored for them. Each `description` is the whole
      # contract, and descriptions are dropped at load, so they cost zero prompt bytes.
      tax_id:
        type: string
        description: >-
          เลขประจำตัวผู้เสียภาษี — the garage's tax identifier. DECLARED BUT UNPOPULATED: no
          value is authored here, because a plausible-looking tax number in a public repository
          is a fake statutory identifier, not demo data. The narrative may bring real ones
          later; declaring the property now means nothing has to change on the day it arrives.
      cert_status:
        type: enum
        values: [valid, expired, none]
        description: >-
          Whether the garage's certification is current. DECLARED BUT UNPOPULATED — the values
          mirror the procurement donor's, but no fleet vendor carries one: the operator has not
          said which certification he tracks, and guessing it would author a compliance claim
          about a real business.
      sanctions_flag:
        type: bool
        description: >-
          Whether the garage appears on a sanctions / debarment list. DECLARED BUT UNPOPULATED —
          this is a legal assertion about a real business and must never be authored as demo
          data. A question filtering on it therefore terminates in the honest no-records answer,
          which is the correct behaviour rather than a gap.
      single_source_flag:
        type: bool
        description: >-
          Advisory marker that this garage is the only source for some work. DECLARED BUT
          UNPOPULATED. The AUTHORITATIVE sole-source record is the per-case
          RepairCaseJustification (ADR-0034 D4), never this field. This vendor-level flag is
          ADVISORY and must NEVER be the basis for a gate decision; if it is ever populated its
          value must be DERIVED from the per-case RepairCaseJustification records and never
          independently authored — two independently-authored statements of one fact can
          disagree, and the per-case record wins.

  Depot:
    primary_key: depot_id
    title_key: name
    description: A yard / partner garage the fleet is based at or routed to for repair.
    properties:
      depot_id:
        type: string
        required: true
      name:
        type: string
        required: true
      depot_type:
        type: enum
        values: [home_yard, partner_garage, roadside_point]
      lat:
        type: float
      lng:
        type: float

  OperationalEvent:
    primary_key: event_id
    description: Time-stamped maintenance / breakdown signal concerning a Truck at a Depot.
    properties:
      event_id:
        type: string
        required: true
      event_type:
        type: enum
        values: [reading, transition, alarm]
      severity:
        type: enum
        values: [info, warn, error, critical]
      measured_value:
        type: float
        description: Quoted repair spend for this event (THB) — what the governed ladder routes on.
      unit:
        type: string
      description:
        type: string
      occurred_at:
        type: timestamp
        required: true
      truck_id:
        type: ref
        target: Truck
      site_id:
        type: ref
        target: Depot

  Alert:
    primary_key: alert_id
    title_key: title
    description: An actionable notification derived from one or more OperationalEvents.
    properties:
      alert_id:
        type: string
        required: true
      title:
        type: string
        required: true
      urgency:
        type: enum
        values: [low, medium, high, critical]
      status:
        type: enum
        values: [open, acknowledged, resolved]
      opened_at:
        type: timestamp
        required: true
      resolved_at:
        type: timestamp
      reasoning:
        type: string

  RecommendedAction:
    primary_key: action_id
    description: An AI-proposed repair decision awaiting human approval; mirrors the ADR-007 D2 runtime envelope.
    properties:
      action_id:
        type: string
        required: true
      action_type:
        type: enum
        # narrative-grounded vocabulary: approve the spend; dispatch a replacement truck
        # ("ต้องไปวิ่งเต้นจ้างรถคอกแถวนั้นมาถ่ายของ"); tow to a partner garage; escalate the ladder.
        # PLAN-0089 adds `schedule_pm_service` — the AT-3 calm path's routine terminal verb. The four
        # verbs above are all EMERGENCY vocabulary (breakdown responses + the hero's DOA routing and
        # approved write); a routine interval booking terminating in one of them would misread in the
        # run record and in the LLM's proposal menu (handlers.py — the enum IS the menu).
        values:
          [
            approve_repair_spend,
            dispatch_replacement_truck,
            tow_to_partner_garage,
            escalate,
            schedule_pm_service,
          ]
      confidence_score:
        type: float
      status:
        type: enum
        values: [proposed, approved, rejected, executed]
      parameters:
        type: json
      alert_id:
        type: ref
        target: Alert
        required: true
      target_truck_id:
        type: ref
        target: Truck

  AlertEventLink:
    primary_key: link_id
    description: Join object linking an Alert to the OperationalEvent(s) that triggered it (N:M via composition per ADR-008 D4).
    properties:
      link_id:
        type: string
        required: true
      created_at:
        type: timestamp
        required: true
      alert_id:
        type: ref
        target: Alert
        required: true
      event_id:
        type: ref
        target: OperationalEvent
        required: true

link_types:
  truck_at_depot:
    from: Truck
    to: Depot
    cardinality: many_to_one
    foreign_key: Truck.site_id -> Depot.depot_id
    description: Each Truck is based at exactly one Depot.

  event_for_truck:
    from: OperationalEvent
    to: Truck
    cardinality: many_to_one
    foreign_key: OperationalEvent.truck_id -> Truck.truck_id

  event_at_depot:
    from: OperationalEvent
    to: Depot
    cardinality: many_to_one
    foreign_key: OperationalEvent.site_id -> Depot.depot_id

  action_addresses_alert:
    from: RecommendedAction
    to: Alert
    cardinality: many_to_one
    foreign_key: RecommendedAction.alert_id -> Alert.alert_id

  action_target_truck:
    from: RecommendedAction
    to: Truck
    cardinality: many_to_one
    foreign_key: RecommendedAction.target_truck_id -> Truck.truck_id

  alert_event_link_to_alert:
    from: AlertEventLink
    to: Alert
    cardinality: many_to_one
    foreign_key: AlertEventLink.alert_id -> Alert.alert_id

  alert_event_link_to_event:
    from: AlertEventLink
    to: OperationalEvent
    cardinality: many_to_one
    foreign_key: AlertEventLink.event_id -> OperationalEvent.event_id
