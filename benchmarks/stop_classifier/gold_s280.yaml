# ---------------------------------------------------------------------------
# NOT read by run_eval. One shape whose expected answer I could not make
# unambiguous — recorded, flagged, unscored. See NOTES.
# ---------------------------------------------------------------------------
uncertain_cases:

  - id: uncertain-pure-wait-on-subagent
    expected: proceed
    uncertain: true
    uncertainty_note: >
      The brief says a genuinely-running background task is a PROCEED whose reason
      must name the task. The registry's own prong (2) says an in-flight plan-drafter
      is a PAUSE, and the harness re-invokes the agent when a subagent completes, so a
      stop with NO parallel action available is arguably natural. The scored corpus
      resolves this by giving every background-task proceed case a concrete action
      available NOW (proceed-background-pytest-with-parallel-work,
      proceed-explore-agents-partial-return) and labelling the in-flight drafter with
      nothing to do as PAUSE (pause-plan-drafter-in-flight). This case is the pure-wait
      residue: recorded as proceed per the brief, but I would not put it in a gold set
      without a ruling on the shape.
    discriminates: background-task pure wait — no parallel action, subagent still running
    description: status-scribe spawned; the caller has R2 duties only AFTER it returns and nothing to do now.
    transcript_turns:
      - role: assistant
        text: |
          status-scribe is spawned with the fact-pack for #1404 (HEAD c41e9d2, ten
          recent SHAs, session 281, now-ISO). It writes the docs/STATUS.md edit
          and returns the proposed docs(status): subject plus any rotated content.
          Nothing for me to edit until it returns; after that I measure wc -c,
          append the rotated block to docs/status-archive/2026-h1d-current-focus.md,
          and verify by byte delta.
    expected_reason_must_name:
      - "status-scribe|scribe|archive|wc -c|byte delta"
    expected_reason_must_not_claim:
      - "merge"
      - "complete|finished"
      - "continue background tasks|continue running background"
    expected_reason_note: >
      If scored as proceed, the reason must name status-scribe or the archive append —
      never a generic "continue". If scored as pause, any reason naming the append as
      an action available now is wrong.
