# Gold set for the NL-query feasibility spike — fleet_maintenance (session 265).
#
# Purpose: the BEFORE/AFTER instrument for "does adding supplier-evaluation
# facts to the ontology make qwen3.8:27b-mtp-q4_K_M and gpt-oss:20b better or
# worse?" (Cray's question, s265). Route (a) was ruled the measurement surface
# because the ontology genuinely reaches THIS prompt — `_describe_ontology`
# feeds `nl_query.answer_question` — whereas it never reaches the
# procedure-baseline prompt at all (measured s265; see PLAN-0117).
#
# 🔴 THE CONTROL BAND IS THE POINT. Every case in the control + ceiling bands is
# answerable from the ontology AS IT STOOD BEFORE PLAN-0117 — not one of them
# needs a property that PLAN added.
# That is deliberate: it is the half of the experiment that can detect the
# answer getting WORSE. PLAN-0117's F16 records that a wider translate
# vocabulary might degrade questions that already worked, and nothing measured
# it. These cases measure it. A supplier-fact case can only show improvement;
# only a control case can show harm.
#
# Every expected value is derived from the adapter's ACTUAL output
# (`FleetMaintenanceSyntheticAdapter.fetch_objects`, dumped s265), not from
# reading `synthetic.py` by eye:
#
#   Truck  (3): truck-01 six_wheeler 412,580 km  due 500,000  roadside_breakdown
#               truck-02 tractor_head 688,140 km due 685,000  in_service
#               truck-03 six_wheeler 254,300 km  due 300,000  in_service
#               ...all three at site_id depot-01
#   Vendor (3): vendor-01 อู่คู่สัญญา ปากช่อง (V-001) is_contracted=true
#                         standing=approved  repairs=24  comebacks=2  turnaround=3.5
#               vendor-02 ส.เจริญยนต์ (V-002) is_contracted=false
#                         standing=approved  repairs=9   comebacks=1  turnaround=5.0
#               vendor-03 เจ๊หงส์ — NO accounting_code, standing=probation, and NO
#                         history facts at all (absent, NOT zero — PR #1335)
#               ...the dormant band (tax_id, cert_status, sanctions_flag,
#               single_source_flag) is declared and carries NO value by ruling
#   Depot  (2): depot-01 ลานจอดสำนักงานใหญ่ (บางพลี)  home_yard
#               depot-02 อู่คู่สัญญา ปากช่อง          partner_garage
#
# ⚠️ Two known traps in this data, both deliberate and both left in:
#   - depot-02 and vendor-01 share the name "อู่คู่สัญญา ปากช่อง" EXACTLY. A
#     name-resolution question can land on either type. No case below depends
#     on resolving that ambiguity; if a future case does, it must say which
#     type it expects and why.
#   - truck_class declares `trailer` but NO truck carries it. A "how many
#     trailers" case would test the honest-zero path, which is NOT the same as
#     the no-data path — that distinction is uncalibrated, so no case asserts
#     it (see `calibration_notes` below).
#
# ⚠️ `fetch_links` returns [] for this vertical (Phase 2 synthetic: none), so
# every cross-type JOIN question is INEXPRESSIBLE here — registered rather than
# silently omitted (CLAUDE.md §8).

vertical: fleet_maintenance

cases:
  # --- control band, expressible by StructuredQuery (8) ----------------------
  - id: fl-01
    text: "List all trucks."
    category: list-all
    ceiling: false
    expected_object_type: Truck
    expected_operation: list
    expected_filters: []
    expected_ids: [truck-01, truck-02, truck-03]
    expected_count: 3
    expected_grounded: true

  - id: fl-02
    text: "How many vendors are on file?"
    category: count
    ceiling: false
    expected_object_type: Vendor
    expected_operation: count
    expected_filters: []
    expected_ids: [vendor-01, vendor-02, vendor-03]
    expected_count: 3
    expected_grounded: true

  - id: fl-03
    text: "รถหกล้อมีคันไหนบ้าง"
    category: filter-enum-thai
    ceiling: false
    expected_object_type: Truck
    expected_operation: list
    expected_filters:
      - {property: truck_class, op: eq, value: six_wheeler}
    expected_ids: [truck-01, truck-03]
    expected_count: 2
    expected_grounded: true

  - id: fl-04
    text: "Which truck is broken down at the roadside?"
    category: filter-enum
    ceiling: false
    expected_object_type: Truck
    expected_operation: list
    expected_filters:
      - {property: status, op: eq, value: roadside_breakdown}
    expected_ids: [truck-01]
    expected_count: 1
    expected_grounded: true

  - id: fl-05
    text: "Which depots are partner garages?"
    category: filter-enum
    ceiling: false
    expected_object_type: Depot
    expected_operation: list
    expected_filters:
      - {property: depot_type, op: eq, value: partner_garage}
    expected_ids: [depot-02]
    expected_count: 1
    expected_grounded: true

  - id: fl-06
    text: "Which trucks have driven more than 600,000 km?"
    category: filter-numeric
    ceiling: false
    expected_object_type: Truck
    expected_operation: list
    expected_filters:
      - {property: odometer_km, op: gt, value: 600000}
    expected_ids: [truck-02]
    expected_count: 1
    expected_grounded: true

  - id: fl-07
    text: "Which trucks are based at depot-01?"
    category: filter-ref
    ceiling: false
    expected_object_type: Truck
    expected_operation: list
    expected_filters:
      - {property: site_id, op: eq, value: depot-01}
    expected_ids: [truck-01, truck-02, truck-03]
    expected_count: 3
    expected_grounded: true

  - id: fl-08
    text: "How many depots are there?"
    category: count
    ceiling: false
    expected_object_type: Depot
    expected_operation: count
    expected_filters: []
    expected_ids: [depot-01, depot-02]
    expected_count: 2
    expected_grounded: true

  # --- ceiling band: needs the phrase step to rescue it (2) ------------------
  # Both compare a property against ANOTHER PROPERTY or against absence, which a
  # conjunctive property-vs-VALUE filter cannot express.
  - id: fl-09
    text: "Which truck is overdue for its next service?"
    category: ceiling-cross-property
    ceiling: true
    # odometer_km > next_service_due_km holds for truck-02 ONLY
    # (688,140 > 685,000). truck-01 412,580 < 500,000; truck-03 254,300 < 300,000.
    expected_answer_substrings: ["70-5678"]   # Truck.title_key is `plate`
    expected_grounded: true

  - id: fl-10
    text: "Which vendor has no accounting code on file?"
    category: ceiling-absence
    ceiling: true
    # vendor-03 is the only record with no `accounting_code` key at all.
    #
    # 🔴 ORACLE LEAK — a PASS here is NOT evidence that absence was expressed.
    # Verified s268 against the SEED ITSELF (`vendor_records` in
    # `verticals/fleet_maintenance/data_adapter/synthetic.py`), not against this
    # file's own header comment:
    #
    #   vendor-03 is the unique record for SIX co-varying reasons, not one. It
    #   alone has no `accounting_code`, no `is_contracted`, no
    #   `repairs_completed_count`, no `comeback_count` and no
    #   `avg_turnaround_days` — and it alone carries `standing=probation`
    #   (vendor-01 and vendor-02 are both `approved` and carry all five facts).
    #
    # Five of those six are ABSENCES, so they sit at the same ceiling as the
    # target and give nothing away. `standing` is the exception and it is the
    # leak: `standing eq probation` is a plain property-vs-VALUE filter, well
    # INSIDE the query language's ceiling, and it retrieves the byte-identical
    # singleton. Because the oracle here is extensional
    # (`expected_answer_substrings` + `expected_grounded`, no assertion on the
    # emitted query), that bypass PASSES without expressing absence in any form.
    #
    # Consequences, both directions:
    #   - `ceiling: true` is a LABEL here, not something the oracle enforces.
    #   - Any figure citing fl-10 — including the s265 "both models emitted the
    #     byte-identical wrong query" finding in RESULTS.md, which localised the
    #     defect to the query language — must be read knowing a passing run need
    #     never have attempted absence at all.
    #
    # Fixing it means de-confounding the seed (which would weaken vendor-03's
    # other, deliberate jobs — see its docstring) or scoring the QUERY SHAPE
    # instead of the answer. Neither is ruled; it is the same fork left open for
    # fl-21/fl-22. Do not quietly re-score the model on either reading.
    expected_answer_substrings: ["เจ๊หงส์"]   # Vendor.title_key is `name`
    expected_grounded: true

  # --- supplier band: the "did it get BETTER?" half (3) -----------------------
  # The cases the PLAN-0117 experiment exists for. They were held in
  # `pending_cases` until the ontology declared the properties AND the seed
  # carried values; both landed in PR #1335, so they are scored cases now,
  # authored against the adapter's ACTUAL dumped output — not by reading
  # `synthetic.py` by eye.
  #
  # ⚠️ Grouping a type by its OWN primary key yields ID-keyed groups. The engine
  # relabels group keys to an entity title only when `group_by` names a property
  # of type `ref` (`_relabel_groups`), and `Vendor.vendor_id` is a plain string
  # primary key. So fl-21/fl-22 are answered as "vendor-01", never as
  # "อู่คู่สัญญา ปากช่อง". That is the engine's documented behaviour, not a defect
  # — but it IS a real thing the operator sees, and it is why these two pin the
  # aggregate rather than an answer substring.
  - id: fl-20
    text: "Which garages are our contracted ones?"
    category: filter-bool
    ceiling: false
    # `is_contracted` is true on vendor-01 ONLY. vendor-02 is explicitly false and
    # vendor-03 is absent — absent is not false, and the filter must not sweep it in.
    expected_object_type: Vendor
    expected_operation: list
    expected_filters:
      - {property: is_contracted, op: eq, value: "true"}
    expected_ids: [vendor-01]
    expected_count: 1
    expected_grounded: true

  - id: fl-21
    text: "Which vendor has the most comebacks?"
    category: superlative
    ceiling: false
    # max `comeback_count` grouped by vendor_id, scanning all 3 vendors.
    # vendor-01 2, vendor-02 1, vendor-03 ABSENT — and absent must stay OUT of the
    # groups rather than arriving as a 0. That is why `groups` is pinned exactly
    # and not just `top`: an absent-treated-as-zero bug leaves `top` correct.
    expected_object_type: Vendor
    expected_operation: max
    expected_count: 3
    expected_aggregate: {value: 2, top: vendor-01, groups: {vendor-01: 2, vendor-02: 1}}
    expected_grounded: true

  - id: fl-22
    text: "อู่ไหนซ่อมเสร็จเร็วที่สุดโดยเฉลี่ย"
    category: superlative-thai
    ceiling: false
    # min `avg_turnaround_days` grouped by vendor_id. vendor-01 3.5, vendor-02 5.0,
    # vendor-03 absent. 🔴 The same vendor wins fl-21 and fl-22, so `top` ALONE
    # cannot discriminate them — a model that picks the wrong aggregate property
    # still lands on vendor-01. `value` and `groups` are what separate them.
    expected_object_type: Vendor
    expected_operation: min
    expected_count: 3
    expected_aggregate: {value: 3.5, top: vendor-01, groups: {vendor-01: 3.5, vendor-02: 5.0}}
    expected_grounded: true

  # --- honesty band: RETIRED, deliberately empty (0) --------------------------
  # `fl-11` shipped here and was retired to `inexpressible:` below after the
  # FIRST live run (s265) measured the INSTRUMENT wrong, not the models. The
  # band is left empty rather than refilled: the register states what a real
  # honesty probe on this vertical has to look like, and inventing one to keep
  # the band populated is how a gold set starts agreeing with itself.

# ---------------------------------------------------------------------------
# INEXPRESSIBLE — registered with reasons (CLAUDE.md §8)
# ---------------------------------------------------------------------------
inexpressible:
  - question: "Which vendor repaired which truck?"
    reason: >
      Requires a cross-type join. `FleetMaintenanceSyntheticAdapter.fetch_links`
      returns [] for every link type (Phase 2 synthetic ships no links), so no
      join question can be answered on this vertical regardless of the model.
      This is a DATA gap, not a model or translate gap, and scoring a model
      against it would measure the fixture.
  - question: "What are the names of the drivers assigned to each truck?"
    reason: >
      Shipped as scored case `fl-11` (honesty probe) and RETIRED after the first
      live run (s265) measured it wrong. Gold asserted `expected_grounded:
      false`, assuming a question about an absent subject short-circuits to the
      no-records path. It does not: Truck records EXIST, so both models
      translated to `Truck / list / no filters`, retrieved all three, and
      `grounded` was necessarily true. `grounded` tracks "did the query retrieve
      records", never "did the answer invent facts" — so `score_case` returned
      `wrong` on the grounded mismatch before it ever read the answer.

      Both models were in fact HONEST, which is exactly what the case existed to
      test. gpt-oss:20b: "No driver information is present in the provided truck
      records, so the driver names cannot be determined."
      qwen3.8:27b-mtp-q4_K_M: "...do not contain any driver name or
      driver-assignment field, so I cannot list drivers from this data."
      Neither invented a name.

      NOT re-expressible by setting expected = what the models did: that makes
      the gold agree with the system by construction (CLAUDE.md §8).
      `score_case` supports only "the answer contains every substring", so it
      cannot state "must not invent" — a negative assertion with no positive
      control, which an empty or evasive answer satisfies just as well. A real
      honesty probe here must name an OBJECT TYPE that does not exist at all
      (energy's `nl-12` shape, which has genuinely no backing data), not a
      missing FIELD on an object type that does.

  - question: "How many trailers are in the fleet?"
    reason: >
      The answer is a legitimate ZERO (truck_class declares `trailer`; no truck
      carries it). Whether the engine reports an honest zero with
      grounded=true, or short-circuits to the no-data path with
      grounded=false, is UNCALIBRATED — and a gold case must not assert a value
      its author cannot defend. Promote this to a real case once the first live
      run settles which path a legitimate zero takes.

calibration_notes: >
  🔴 THIS GOLD SET IS NOT YET AN ORACLE (CLAUDE.md §8): an expected-value set
  becomes one only when the system's own output has been scored against it.
  Nothing here has been. The offline well-formedness test compares this file to
  itself — it reddens on a malformed file and CANNOT redden on a wrong value.

  🔴 RECORDED, not a defect: fl-21 and fl-22 are answered as `vendor-01`, never as
  the garage's Thai name. `_relabel_groups` maps group keys to an entity title only
  when `group_by` names a `ref` property, and `Vendor.vendor_id` is the type's own
  string primary key. Whether an operator accepts an internal id as the answer to
  "อู่ไหนซ่อมเสร็จเร็วที่สุด" is a PRODUCT question, deliberately left open here — the
  gold scores what the engine computes, and the computation is right.

  Specifically uncalibrated and expected to need one correcting pass after the
  FIRST live run: the two `expected_answer_substrings` in fl-09 and fl-10. Both
  assume the phrase step renders an entity by its `title_key` (`plate` for
  Truck, `name` for Vendor). That is the documented title semantics, but it has
  not been observed on this vertical. If the first run phrases fl-09 as
  "truck-02" rather than "70-5678", the SUBSTRING is wrong and the model is
  not — fix the substring, and record that it was the instrument that was
  wrong, never quietly re-score the model.
