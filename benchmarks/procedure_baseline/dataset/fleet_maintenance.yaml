# Procedure-baseline ground truth — fleet_maintenance (FDE program phase 1.6).
#
# "Governed Repair Approval": a garage quote at/above THIS truck's own
# minor_repair_ceiling_thb breaches into the governed DOA ladder.
#   breach: quote >= 5001      watch: 4501 <= quote < 5001      ok: quote < 4501
#
# The ฿500 watch band is AUTHORED HERE, exactly as every other dataset authors
# its own. It is not read from the shipped procedure — fleet's judge step
# declares no watch_margin, and neither does energy's, yet energy's dataset
# carries watch items. The band is operationally meaningful rather than filler:
# a repair quoted a few hundred baht under the ceiling is the case a fleet
# manager wants visibility on, because repeated near-ceiling quotes on one truck
# are a signal even though no single one crosses.
#
# Watch items deliberately declare NO handler tiers. That is the M-2=b
# calibration state (PLAN-0022 Phase 3): they run the LLM and report the
# suggested-handler distribution WITHOUT scoring it, because no watch-tier ground
# truth has been adjudicated for fleet. Pinning one here would be inventing an
# answer, and an invented ground truth scores models against the author rather
# than against the domain.
#
# Domain facts, all sourced rather than invented:
#   * minor_repair_ceiling_thb = 5001 — design partner Q8, 2026-07-28 discovery
#     round ("ต้อม ~5,000; some tractor heads stretch a bit"). 5001 encodes his
#     inclusive "up to 5,000" under an at/above comparison.
#   * DOA ladder (verticals/fleet_maintenance/procedures.yaml): 0 -> ช่างใหญ่,
#     5001 -> ผจก.เดินรถ, 30001 -> เจ้าของกิจการ.
#   * The sourcing-hygiene rule_gate wants three competing quotes above ฿30,000.
#   * Truck ids / plates / classes follow the shipped synthetic seed's shape.
#
# WHY THIS DATASET EXISTS, and how its ground truth differs from energy's.
# The energy set pins canonical_handler: restart with acceptable_handlers: [] —
# every other registered handler grades "other". Measured on 2026-08-28, that
# convention alone drove a challenger model to alpha 0% while it was emitting
# perfectly valid enum members (escalate, dispatch_technician) that a human could
# defend for a 96 C asset. That is a dataset convention scoring as a model defect.
#
# So this set declares acceptable_handlers HONESTLY, per scenario:
#   * When the event is purely "who may authorise this spend", escalate is the
#     only handler that answers the question and acceptable stays empty.
#   * When the truck is DISABLED at the roadside, towing it or dispatching a
#     replacement are genuinely defensible responses to the same event, so they
#     are declared acceptable rather than silently graded wrong.
# A model that picks a defensible action should not lose points for failing to
# guess which single string an author pinned.
#
# 20 items: 14 breach (weighted to the ceiling boundary and across BOTH DOA
# bands) + 3 watch + 3 ok. A 20-item set is a SUBSET by design — never quote a
# number from it as if it came from the 66-item energy set.

vertical: fleet_maintenance
procedure: governed_repair_approval
reading_parameter: repair_quote_thb
threshold_note: >-
  Per-truck minor_repair_ceiling_thb (5001 THB, partner Q8), breach AT/ABOVE,
  with a ฿500 watch band authored for this dataset (4501-5000).

items:
  # --- Family A: plain spend escalation, mid DOA band (5,001-30,000) ----------
  # The truck is drivable; the only open question is who may authorise the spend.
  # acceptable_handlers is empty here BECAUSE no other handler answers that
  # question — not as a default.
  - id: fleet-001
    description: ฿5,001 — exactly at the ceiling; inclusive breach, mid band.
    scenario:
      event_id: fleet-evt-001
      entity_type: Truck
      primary_key: truck-01
      measured_value: 5001.0
      unit: THB
      threshold: 5001.0
      direction: above
      watch_margin: 500.0
      context: {plate: "80-1234 กรุงเทพมหานคร", truck_class: six_wheeler, symptom: "brake pad replacement", drivable: true, quotes_obtained: 1}
    expected:
      disposition: breach
      action_expected: true
      affected_primary_key: truck-01
      canonical_handler: escalate
      acceptable_handlers: []
      action_keywords: [escalat, approv, authoris, authoriz]
      forbidden_keywords: [tow]

