# PLAN-0047 Step 7 (AC-10): the offline gate, enforced on every PR.
# SD-4 (ratified 2026-07-03) = DB-backed tests included: a postgres:16-alpine
# service container mirrors docker-compose.yml; migrations run against the
# fresh vero_lite DB (AC-9) and the suite owns the disposable vero_lite_test
# sibling (tests/db_support.py — never the dev DB).
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vero
          POSTGRES_PASSWORD: vero # pragma: allowlist secret — throwaway CI-container cred, same as docker-compose.yml
          POSTGRES_DB: vero_lite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vero -d vero_lite"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      # PLAN-0107 AC-14: depth 2, not the default 1. The cache-bust gate below
      # compares the PR's two revisions, and at depth 1 `HEAD^1` does not exist —
      # the check would ERROR rather than run, which is the likeliest way to
      # disarm it by accident.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (locked, with dev tools)
        run: uv sync --extra dev --frozen

      # --no-sync below: a bare `uv run` re-syncs WITHOUT the dev extra and
      # uninstalls pytest/ruff/mypy mid-job (project memory
      # project_uv_run_shared_venv_dev_tool_thrash).
      - name: ruff check
        run: uv run --no-sync ruff check .

      - name: ruff format check
        run: uv run --no-sync ruff format --check .

      # PLAN-0107 AC-1 (① instrument). CI had NO JavaScript runtime, so a syntax
      # error in a shipped asset reached the browser with every test green — the
      # Tab I class of defect. `node` ships on the ubuntu runner, so this adds no
      # dependency (measured: 11.0 s over the 21 assets).
      #
      # Enumerated from DISK, never a frozen list, and floored at NON-EMPTY
      # rather than at a count: a `-ge 20` floor over a population of 21 leaves
      # one file of headroom and its misfire remedy is editing the number — the
      # guard-erosion ratchet this PLAN exists to stop. The count invariant lives
      # in AC-2's bijection test instead, which is strictly stronger.
      # `nullglob` is load-bearing: without it an unmatched glob expands to the
      # literal pattern, the array is length 1, and the emptiness test passes
      # while `node --check` runs against a file that does not exist.
      - name: JS assets parse (node --check)
        run: |
          shopt -s nullglob
          files=(services/api/static/assets/*.js)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no services/api/static/assets/*.js matched — the glob found nothing, so this gate would pass vacuously"
            exit 1
          fi
          echo "checking ${#files[@]} JS asset(s)"
          for f in "${files[@]}"; do node --check "$f"; done

      # PLAN-0107 AC-14: replaces `test_every_edited_asset_got_a_cache_bust`, which
      # froze per-file token floors over 9 of 21 JS files and 0 of 4 CSS files — it
      # passed while the property it guarded (edit an asset, bump its token) was
      # unenforced for `views.css`. Deleted in the same commit as this step, not kept
      # alongside. Needs the `fetch-depth: 2` above.
      - name: Static assets carry a fresh ?v= token (diff-aware)
        run: uv run --no-sync python tools/ci/cache_bust_diff_check.py

      # PLAN-0107 AC-5: `verticals/` joins the CI mypy scope. The pre-commit hook
      # already covered it; CI merely stops TRUSTING that the hook ran. Measured
      # clean over 64 files at adoption, so remediation cost was zero. `tools/` is
      # deliberately excluded — it has a module-layout collision
      # (`Source file found twice: "loop._schema" and "tools.loop._schema"`) that
      # must be fixed before it can be scoped here.
      - name: mypy (strict, services/ + verticals/)
        run: uv run --no-sync mypy --strict services/ verticals/

      # PLAN-0107 AC-6: two pre-commit hooks existed but ran ONLY on a developer
      # machine, so a `--no-verify` commit or an unhooked clone bypassed both.
      # `detect-secrets` guards a PUBLIC repo (CLAUDE.md §8) and the ontology
      # schema check guards the semantic layer — the core primitive, whose schema
      # appears in `tests/` exactly zero times.
      #
      # `uv run --no-sync`, NOT `uvx`: all three tools are already in the dev
      # extra installed above, so `uvx` would resolve and download a second copy;
      # and a bare `uv run` re-syncs without the dev extra and uninstalls the
      # tooling mid-job.
      - name: Secret scan (pre-commit detect-secrets)
        run: uv run --no-sync pre-commit run detect-secrets --all-files

      - name: Ontology schema check (pre-commit check-jsonschema)
        run: uv run --no-sync pre-commit run check-jsonschema --all-files

      - name: Migrations on a fresh DB (AC-9)
        env:
          DATABASE_URL: postgresql+asyncpg://vero:vero@localhost:5432/vero_lite # pragma: allowlist secret
        run: uv run --no-sync alembic upgrade head

      # PLAN-0049 Step 5 (SD-5): the migration<->ORM lockstep guard. After
      # `upgrade head`, `alembic check` autogenerates against the migrated DB and
      # FAILS if the generated ORM has drifted from the migration chain (a column
      # added to the ontology/ORM without its migration). compare_type is on
      # (alembic/env.py), so type changes are caught too.
      - name: Migration <-> ORM lockstep guard (alembic check)
        env:
          DATABASE_URL: postgresql+asyncpg://vero:vero@localhost:5432/vero_lite # pragma: allowlist secret
        run: uv run --no-sync alembic check

      - name: Full test suite (offline gate + DB-backed tests)
        env:
          DATABASE_URL: postgresql+asyncpg://vero:vero@localhost:5432/vero_lite # pragma: allowlist secret
          TEST_DATABASE_URL: postgresql+asyncpg://vero:vero@localhost:5432/vero_lite_test # pragma: allowlist secret
        run: uv run --no-sync pytest -q

      # The suite above cannot catch a missing RUNTIME dependency: it runs in the
      # dev venv, which carries every dev extra and everything they drag in. The
      # shipped image installs `--no-dev`, so the two dependency sets differ and
      # nothing compared them. That gap shipped an image that could not
      # `import services.api.main` at all for ten days, while every test stayed
      # green (python-multipart arrived only as a transitive dep of the `mcp` dev
      # extra; FastAPI resolves multipart route signatures at import time).
      #
      # This step reproduces the IMAGE's dependency set exactly — same flags as
      # the Dockerfile. It runs LAST and into its own UV_PROJECT_ENVIRONMENT so it
      # cannot strip the dev venv the steps above depend on (project memory: a
      # bare `uv sync` without the dev extra uninstalls pytest/ruff/mypy mid-job).
      #
      # PLAN-0107 AC-3 (① instrument): it now BOOTS rather than imports. Importing
      # proves the module resolves; everything the spine actually does happens
      # inside `lifespan` — discovery, the executor registrar, persona resolution,
      # and (for four of five verticals) the `procedures.yaml` parse whose
      # fail-loud contract CLAUDE.md §3 promises. A boot subsumes the import: a
      # module that cannot import cannot boot. `httpx` is a RUNTIME dep, so
      # TestClient works in the --no-dev venv.
      #
      # 🔴 Once per SPEC-SHIPPING vertical, enumerated from disk. Measured s235:
      # `lifespan` registers only the ACTIVE vertical's factory, so booting the
      # default alone catches a malformed spec for `energy` — which is the ONE
      # vertical whose factory never calls `load_procedures`, and the default.
      # Booting only the default would have been green and blind to exactly the
      # configuration CI runs. The `energy` spec-parse residual stays OPEN: closing
      # it means energy's factory loading its own spec, a behaviour change.
      - name: Runtime closure BOOTS the app's lifespan, per vertical (--no-dev, as the image installs it)
        env:
          UV_PROJECT_ENVIRONMENT: /tmp/vero-runtime-venv
          DATABASE_URL: postgresql+asyncpg://vero:vero@localhost:5432/vero_lite # pragma: allowlist secret
          # REQUIRED, and it is not decoration. `--no-install-project` below means
          # `services`/`verticals` are NOT in the venv's site-packages — deliberately,
          # because this step reproduces the IMAGE's dependency set. The step this
          # replaced got away without it: `python -c "..."` puts the CWD on sys.path,
          # while `python tools/ci/boot_smoke.py` puts the SCRIPT's directory
          # (tools/ci/) there instead. Dropping this line reproduces
          # `ModuleNotFoundError: No module named 'services'` (measured, first run).
          PYTHONPATH: .
        run: |
          uv sync --frozen --no-dev --no-install-project
          shopt -s nullglob
          specs=(verticals/*/procedures.yaml)
          if [ "${#specs[@]}" -eq 0 ]; then
            echo "::error::no verticals/*/procedures.yaml matched — nothing would be booted, so this gate would pass vacuously"
            exit 1
          fi
          echo "booting ${#specs[@]} spec-shipping vertical(s)"
          for spec in "${specs[@]}"; do
            vertical="$(basename "$(dirname "$spec")")"
            OCT_VERTICAL="$vertical" /tmp/vero-runtime-venv/bin/python tools/ci/boot_smoke.py
          done
