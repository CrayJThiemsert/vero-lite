repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # `tests/**/fixtures/` holds CAPTURED artifacts — real pytest/tool output committed
      # as a closed-incident pin. A whitespace hook that rewrites them is editing the
      # evidence: `end-of-file-fixer` silently appended a newline to three s277 junit
      # captures on their first commit (PLAN-0121 Step 0), which would have falsified the
      # byte-verbatim provenance those fixtures are FOR. Excluded so the bytes on disk stay
      # the bytes that were measured.
      - id: trailing-whitespace
        exclude: ^tests/.*/fixtures/
      - id: end-of-file-fixer
        exclude: ^tests/.*/fixtures/
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.9.0
          - pydantic-settings>=2.5.0
          - fastapi>=0.115.0
          - sqlalchemy>=2.0.35
          - structlog>=24.4.0
          - httpx>=0.27.0
          - typer>=0.12.0
          - ruamel.yaml>=0.18.0
          - jsonschema>=4.23.0
          - types-jsonschema>=4.23.0
          - types-croniter>=2.0.0
        args: [--config-file=pyproject.toml]
        # PLAN-0008 Step 7: extend coverage to .claude/hooks/** so the
        # Phase 2 hook scripts (Step 1–5b) are gated at commit time, not
        # only when a developer remembers to run mypy locally. All 9
        # current hook files pass --strict cleanly as of 2026-05-24.
        files: ^(services|verticals|\.claude/hooks)/

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package.lock.json

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.29.4
    hooks:
      - id: check-jsonschema
        name: check ontology YAML against ADR-008 D2 schema
        files: ^verticals/.*/ontology/.*\.yaml$
        args: ['--schemafile', 'services/engine/ontology_schema.json']

  # PLAN-004 Phase B: validate the LATEST session's handoff frontmatter and
  # refresh its INDEX.md on every commit. Handoffs are gitignored (never
  # staged), so this is a working-tree check: always_run + pass_filenames:false.
  # Scoped to the newest session-NN only (no legacy drag); blocks the commit on
  # an error-severity finding in the active session.
  - repo: local
    hooks:
      - id: handoff-frontmatter
        name: validate latest-session handoffs + refresh INDEX
        entry: uv run --no-sync python tools/handoffs/precommit_handoffs.py
        language: system
        always_run: true
        pass_filenames: false

      # Rotation policy R1 (Lesson #23): docs/STATUS.md hard ceiling 64 KB /
      # soft 48 KB. The authoritative deterministic check — the status-scribe
      # has no Bash and can only enforce structural counts (R2/R3).
      - id: status-size-guard
        name: STATUS.md size guard (R1 — 64 KB hard ceiling)
        entry: uv run --no-sync python tools/check_status_size.py
        language: system
        files: ^docs/STATUS\.md$
        pass_filenames: false

      # Rotation policy R4 (archive size escape): docs/status-archive/*.md stay
      # under a 256 KB cap; over ~192 KB, start a continuation file. R4 was the
      # one size-bearing rule with no mechanism (its matrix guard column read
      # "—") and rotted to a 3x breach by s144. files:-scoped, NOT always_run:
      # a byte cap can only be breached by writing to the file it caps, unlike
      # R7 below, whose violation can be authored anywhere.
      - id: archive-size-guard
        name: status-archive size guard (R4 — 256 KB cap / 192 KB split)
        entry: uv run --no-sync python tools/check_archive_size.py
        language: system
        files: ^docs/status-archive/.*\.md$
        pass_filenames: false

      # Rotation policy R7: no tracked artifact may cite docs/STATUS.md by line
      # number — STATUS is state (inverts CLAUDE.md §1 as an authority) and
      # R2/R6 re-prune it every reconcile, so the anchor rots by construction.
      # always_run because the guard scans the whole tracked tree (744 files,
      # ~0.1 s), not just the staged paths.
      - id: status-citation-guard
        name: STATUS.md citation guard (R7 — no line-number refs)
        entry: uv run --no-sync python tools/check_status_citations.py
        language: system
        always_run: true
        pass_filenames: false

      # Rotation policy R8: no tracked artifact may cite a PLAN by its
      # PRE-ARCHIVE path. Completing a PLAN ends in `git mv docs/plans/NNNN-*.md
      # docs/plans/done/`, which kills every reference to the old path at once,
      # silently — nothing errors and the prose still reads correctly. Same
      # "anchor rots by construction" failure as R7, opposite direction.
      # The predicate is MOVED (gone from plans/ AND present in done/), never
      # MISSING: measured s183, "must resolve" flags 89 files — overwhelmingly
      # placeholders — while moved-only flags 29, every one a real dead pointer.
      # always_run because the guard scans the whole tracked tree, and because
      # the violation is authored by moving a DIFFERENT file than the citer.
      - id: plan-archive-ref-guard
        name: PLAN reference guard (R8 — no pre-archive docs/plans/ refs)
        entry: uv run --no-sync python tools/check_plan_archive_refs.py
        language: system
        always_run: true
        pass_filenames: false

      # The OFFLINE half of the migration<->ORM lockstep (PR #965). CI's
      # `alembic check` catches column drift but needs a live database; a
      # pre-commit hook that fails whenever Postgres is down — or in a worktree,
      # which has no .env — is one developers learn to bypass. This half needs no
      # database: it asserts statically that every module declaring a
      # __tablename__ is imported by alembic/env.py. That is the exact class that
      # cost a CI round in #965, and the one the test suite structurally cannot
      # see (Base.metadata.create_all knows only what the TEST module imported;
      # nothing offline traverses env.py). always_run because the violation is
      # authored by adding a model file while editing a DIFFERENT one — env.py.
      - id: alembic-model-registration
        name: ORM<->alembic registration guard (offline lockstep half)
        entry: uv run --no-sync python tools/check_alembic_model_registration.py
        language: system
        always_run: true
        pass_filenames: false

      # A claim declared RETIRED must not survive anywhere live
      # (docs/conventions/retired-claims.md). This repo records corrections well
      # and PROPAGATES them badly: measured s241, `warm.sh:11` kept asserting a
      # claim SKILL.md corrected at s171 for two more months, and that same
      # file's footer kept pointing at a host-state gate home corrected at s174,
      # 165 lines below the correction. Both were found by a human, late; nothing
      # could find them mechanically because a correction records the new answer
      # and the repo kept no account of the retired one. always_run because the
      # violation is authored by editing a DIFFERENT file than the one that
      # declared the claim dead — the cross-file half is the whole point.
      - id: retired-claim-guard
        name: retired-claim propagation guard (a corrected claim must stay dead)
        entry: uv run --no-sync python tools/check_retired_claims.py
        language: system
        always_run: true
        pass_filenames: false

      # An AC's ledger must agree with itself
      # (tools/check_ac_consistency.py). Two failures measured s241, neither
      # visible to any existing check: PLAN-0108 shipped SIX AC items wearing
      # FIVE labels (two both read AC-5) — valid Markdown, lint-clean, and in the
      # one PLAN whose subject is AC-authoring hygiene; and docs/STATUS.md
      # recorded "AC-11 CLOSED" in four places while PLAN-0107 still carried
      # `- [ ] **AC-11`, so the file an executor opens said the work was open.
      # always_run because both violations are authored by editing ONE side of a
      # pair — a PLAN without STATUS, or STATUS without the PLAN.
      - id: ac-consistency-guard
        name: AC ledger guard (no duplicate labels; STATUS closures are ticked)
        entry: uv run --no-sync python tools/check_ac_consistency.py
        language: system
        always_run: true
        pass_filenames: false
