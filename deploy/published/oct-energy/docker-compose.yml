# The PUBLISHED OCT demo project (PLAN-0100 Step 8 / ADR-0035).
#
# EXACTLY TWO SERVICES: `app` + `cloudflared`. There is deliberately no `nginx`
# (SD-3's ruling — the rate cap is a Cloudflare zone rule, not an nginx
# `limit_req`) and no `postgres` (SD-1's DB-less ruling). The dev
# `docker-compose.yml` at the repo root is unaffected and keeps its published
# ports per ADR-0003.
#
# NO `ports:` KEY ON ANY SERVICE — that is AC-5, and it is the point of the whole
# topology: the only way in is through the tunnel, so a host firewall mistake
# cannot expose `app` directly (D1(1), 0035:266-274).

# PROJECT NAME = THIS DIRECTORY'S NAME, and that is a rule, not a coincidence
# (PLAN-0103 Step 4b). `tests/deploy/test_published_profiles.py` asserts the two
# are equal for every profile, so a fourth system cannot inherit a name by
# copy-paste: the guard reddens instead of two projects silently sharing a
# network. Renamed from `vero-published` in Step 4b — see README.md's migration
# note if a project under the old name is still running on the host.
name: oct-energy

services:
  # Same image as the dev project and the same contract: this service adds
  # composition concerns only and declares NO `command:`, so the image's CMD
  # stays the single definition of how the app runs (PLAN-0095 SD-1).
  app:
    build:
      # 🔴 THREE levels, not two, and the difference is a build that cannot run.
      # This file sits at `deploy/published/<system>/`, so `../..` reaches `deploy/`
      # — which has no Dockerfile. Step 4a moved this compose one directory deeper
      # without following the relative context, and `docker compose config` does
      # NOT check that a build context exists, so it validated clean for two
      # sessions. `test_published_profiles.py` now resolves this path and asserts a
      # Dockerfile is actually there.
      context: ../../..
    container_name: oct-energy-app
    env_file:
      - published.env
    environment:
      # API_KEYS maps sha256(raw-key) -> person_id and is a SECRET, so it can never
      # join published.env — that file is committed and is AC-4's parse target
      # (CLAUDE.md §8). A BARE pass-through takes the value from the host
      # environment or an uncommitted deploy/published/.env, so the secret reaches
      # the container without ever entering the repo.
      #
      # ⚠️ WITHOUT THIS KEY THE VARIABLE NEVER REACHES THE CONTAINER. `env_file`
      # loads published.env and nothing else, and compose does not forward the
      # host environment on its own — so the demo was unloginable no matter what
      # the operator exported, and Step 9 case 1's positive control (keyed
      # /whoami -> 200, "the only evidence the demo is loginable at all") could
      # never pass. README.md documented the provisioning and the plumbing was
      # missing.
      #
      # DELIBERATELY OPTIONAL, unlike CLOUDFLARED_CREDENTIALS_FILE below. A
      # `${API_KEYS:?…}` form would fail `up` when the key is absent, and that
      # contradicts the committed contract: README.md and published.env:8-12 both
      # state that with API_AUTH_ENABLED=true and no API_KEYS the demo boots,
      # serves every unkeyed route, and returns 401 from /whoami — "the correct,
      # and Step 9-asserted, behaviour". Fail-closed here would make a documented
      # state unreachable.
      - API_KEYS
    # OLLAMA_HOST is pinned to host.docker.internal (§Pinned values). Docker
    # Desktop resolves that name on its own; the Linux engine does NOT, and
    # without this line every LLM call on a Linux host fails DNS and silently
    # degrades to the deterministic arm — a demo that looks like it is working.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - prompt-log:/var/log/vero/prompt-log
    networks:
      - vero_oct
    restart: unless-stopped

  cloudflared:
    # This system's OWN connector, in this system's OWN compose project — the
    # D4/L5 amendment's reading (a), ratified in #1057 (Cray's typed ruling).
    image: cloudflare/cloudflared:2025.8.1
    container_name: oct-energy-cloudflared
    # Locally-managed tunnel: the ingress map lives in the committed config.yml,
    # NOT in the Cloudflare dashboard. A bare `tunnel --token …` run would void
    # AC-6(a) — see the header of cloudflared/config.yml.
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      # The tunnel credentials are a SECRET and never enter this repo
      # (CLAUDE.md §8). Required, not defaulted: a missing value must fail the
      # `up` loudly rather than mount something unintended.
      - ${CLOUDFLARED_CREDENTIALS_FILE:?set CLOUDFLARED_CREDENTIALS_FILE to the tunnel credentials JSON on the host}:/etc/cloudflared/credentials.json:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - vero_oct
    restart: unless-stopped

networks:
  # THE ANTI-BYPASS BOUNDARY (review finding 3). `app` joins this network and
  # nothing else, and the ONLY other member is vero-lite's own `cloudflared`.
  #
  # ⚠️ NO OTHER CONNECTOR MAY JOIN `vero_oct`. A second connector on this network
  # reaches `app:8000` directly and skips the ingress allowlist entirely — and it
  # would produce BYTE-IDENTICAL AC-6(a) output, because AC-6(a) reads the
  # committed config file and cannot see who else is on the wire. Step 9 proves
  # the topology; this comment states it.
  #
  # Not `internal: true`: `cloudflared` must reach Cloudflare's edge outbound.
  # The inbound protection is the absence of `ports:`, not network isolation.
  #
  # 🔴 THE FIXED `name: vero_oct` IS GONE, AND ITS ABSENCE IS THE MECHANISM.
  # PLAN-0103 Step 4b resolved the standing instruction this block used to carry
  # (drop the key vs. carry a per-system name) in favour of DROPPING IT. Compose
  # then scopes the network under the project, so this system's network is
  # `oct-energy_vero_oct` and the next system's is `oct-<its-dir>_vero_oct` —
  # distinct by construction rather than by remembering to edit a literal.
  #
  # Why that direction and not a per-system literal: the hazard being closed is a
  # COPY-PASTE, and a per-system literal is exactly the thing a copy-paste
  # forgets. Two compose projects both declaring `name: vero_oct` join the SAME
  # Docker network, so each system's connector reaches the other's `app:8000` and
  # skips that system's allowlist entirely — and ADR-0035 `0035:490-493` names a
  # shared network as a condition under which "the arrangement has drifted and
  # this ADR is reopened". With no literal to forget, a new profile cannot
  # reintroduce it by inattention; `test_published_profiles.py` asserts that NO
  # profile declares a fixed network `name:` at all, so it cannot be added back
  # by intention either without the guard going red.
  #
  # ⚠️ The trade this makes, stated so nobody rediscovers it as a surprise: the
  # network name is now DERIVED, so `docker network ls` shows a name that appears
  # verbatim nowhere in this repo. Grep for the project name instead.
  vero_oct:
    driver: bridge

volumes:
  # ADR-0035 D6: 90-day rolling prompt log, Cray-only reader, no IP / headers /
  # gate identity stored. A named volume so the rows survive a container replace.
  prompt-log:
    name: oct-energy-prompt-log
