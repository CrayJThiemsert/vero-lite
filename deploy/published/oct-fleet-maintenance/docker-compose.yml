# The PUBLISHED fleet-maintenance system (PLAN-0103 Step 4b / ADR-0036 D5 /
# ADR-0037).
#
# THREE SERVICES — `app` + `cloudflared` + `postgres` — and the third is what makes
# this file different from every other profile. LOCKED-1 (Cray, typed s218) grants
# this system, and only this system, a database; ADR-0037 is the ADR that makes the
# grant legitimate and attaches its compliance obligations. The other published
# systems stay DB-less and their composes carry no `postgres`.
#
# NO `ports:` KEY ON ANY SERVICE — PLAN-0100 AC-5's property, preserved per system
# (PLAN-0103 AC-3). ⚠️ Worth stating twice here, because the repo-root
# `docker-compose.yml` DOES publish Postgres on ${POSTGRES_HOST_PORT:-5432} for dev
# convenience. Copying that habit into this file would expose a database carrying
# visitor-typed personal data to the host network.
#
# This file is a deliberate near-duplicate of the sibling profiles' composes.
# ADR-0036 D5 accepts N ≤ 3 near-duplicates rather than a generator (Rule of
# Three), and PLAN-0103 puts a compose generator explicitly out of scope.

# PROJECT NAME = THIS DIRECTORY'S NAME, and that is a rule, not a coincidence
# (PLAN-0103 Step 4b). `tests/deploy/test_published_profiles.py` asserts the two
# are equal for every profile, so this file cannot inherit the donor profile's
# project name by the copy-paste that produced it.
name: oct-fleet-maintenance

services:
  # Same image as every other project and the same contract: this service adds
  # composition concerns only and declares NO `command:`, so the image's CMD stays
  # the single definition of how the app runs (PLAN-0095 SD-1).
  app:
    build:
      # THREE levels: this file is at `deploy/published/<system>/`, so `../..` would
      # reach `deploy/` — which has no Dockerfile. Guard-asserted.
      context: ../../..
    container_name: oct-fleet-maintenance-app
    env_file:
      - published.env
    environment:
      # API_KEYS maps sha256(raw-key) -> person_id and is a SECRET, so it can never
      # join published.env — that file is committed and is AC-4's parse target
      # (CLAUDE.md §8). A BARE pass-through takes the value from the host
      # environment, so the secret reaches the container without entering the repo.
      #
      # ⚠️ WITHOUT THIS KEY THE VARIABLE NEVER REACHES THE CONTAINER. `env_file`
      # loads published.env and nothing else, and compose does not forward the host
      # environment on its own.
      #
      # 🔴 ON THIS SYSTEM AN UNSET API_KEYS IS A BROKEN DEMO, not a posture. The
      # three personas (LOCKED-5) are the whole story — a visitor is meant to be
      # REFUSED as one persona and GRANTED as another. Provision it at bring-up.
      - API_KEYS
      # The database URL carries the password, so it is composed at RUNTIME from a
      # host-env secret rather than committed. Required with no default: a missing
      # value must fail the `up` loudly rather than silently starting a system whose
      # database it cannot reach.
      #
      # ⚠️ LIST form (`- KEY=value`), not mapping form, and quoted. This block
      # already uses a bare `- API_KEYS` pass-through, and YAML forbids mixing a
      # sequence item with a mapping key in one block; the quotes additionally stop
      # the `:?` in the interpolation being read as a complex-key indicator.
      - "DATABASE_URL=postgresql+asyncpg://vero:${OCT_FLEET_DB_PASSWORD:?set OCT_FLEET_DB_PASSWORD on the host - it is a secret and never enters this repo}@postgres:5432/vero_lite"
    # OLLAMA_HOST is pinned to host.docker.internal. Docker Desktop resolves that
    # name on its own; the Linux engine does NOT, and without this line every LLM
    # call on a Linux host fails DNS and silently degrades to the deterministic arm
    # — a demo that looks like it is working. This system publishes Tab C, so that
    # degradation would be visible on a route a visitor drives.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - prompt-log:/var/log/vero/prompt-log
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vero_oct
    restart: unless-stopped

  # 🔴 THE LOCKED-1 GRANT, AND THE ONLY POSTGRES IN ANY PUBLISHED PROFILE.
  #
  # What it holds is the reason it needs its own compliance story: Tab I is a
  # VISITOR-WRITABLE surface whose free text persists here. That is a processing
  # activity the published demo's existing RoPA does not cover — it describes a
  # DB-less system whose entire personal-data story is the prompt log. AC-11 makes
  # the updated RoPA a PRECONDITION of this system's bring-up (ADR-0037 D2.1), and
  # it is Cray's artifact as data controller, not this PLAN's to author.
  postgres:
    image: postgres:16-alpine
    container_name: oct-fleet-maintenance-postgres
    environment:
      POSTGRES_USER: vero
      # Host-env secret, required with no default — the same discipline as the
      # tunnel credentials. Never a committed literal (CLAUDE.md §8): this repo is
      # public, and the database stores visitor-typed personal data.
      POSTGRES_PASSWORD: "${OCT_FLEET_DB_PASSWORD:?set OCT_FLEET_DB_PASSWORD on the host - it is a secret and never enters this repo}"
      POSTGRES_DB: vero_lite
    volumes:
      - pgdata:/var/lib/postgresql/data
    # ⚠️ NO `ports:`. The repo-root dev compose publishes 5432; this one must not.
    # The database is reachable from this system's `app` and from nothing else.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vero -d vero_lite"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vero_oct
    restart: unless-stopped

  cloudflared:
    # This system's OWN connector, in this system's OWN compose project — the
    # ADR-0035 D4/L5 amendment's reading (a), ratified in #1057.
    image: cloudflare/cloudflared:2025.8.1
    container_name: oct-fleet-maintenance-cloudflared
    # Locally-managed tunnel: the ingress map lives in the committed config.yml,
    # NOT in the Cloudflare dashboard. A bare `tunnel --token …` run would move the
    # allowlist out of this repo — see the header of cloudflared/config.yml.
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      # The tunnel credentials are a SECRET and never enter this repo
      # (CLAUDE.md §8). Required, not defaulted.
      - ${CLOUDFLARED_CREDENTIALS_FILE:?set CLOUDFLARED_CREDENTIALS_FILE to this system's tunnel credentials JSON on the host}:/etc/cloudflared/credentials.json:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - vero_oct
    restart: unless-stopped

networks:
  # THE ANTI-BYPASS BOUNDARY, and on this system it bounds a DATABASE as well as an
  # app. `app`, `postgres` and this system's `cloudflared` are the only members.
  #
  # 🔴 NO FIXED `name:` KEY, AND THE ABSENCE IS THE MECHANISM (PLAN-0103 AC-4).
  # Compose scopes the network under the project, so this one is
  # `oct-fleet-maintenance_vero_oct` — distinct by construction rather than by
  # remembering to edit a literal in a copied file.
  #
  # The stake is higher here than on the DB-less systems: a shared network would
  # not only let another system's connector reach this `app:8000` and skip this
  # allowlist, it would put `postgres:5432` on the same wire. ADR-0035
  # (`0035:490-493`) names a shared network as grounds for reopening the whole
  # hosting arrangement. `test_published_profiles.py` asserts NO profile declares a
  # fixed network `name:`, so it cannot be reintroduced by intention either.
  #
  # Not `internal: true`: `cloudflared` must reach Cloudflare's edge outbound. The
  # inbound protection is the absence of `ports:`, not network isolation.
  vero_oct:
    driver: bridge

volumes:
  # ADR-0035 D6: 90-day rolling prompt log, Cray-only reader, no IP / headers /
  # gate identity stored. Per-system name (AC-4) — volume names are GLOBAL on the
  # Docker daemon, and the log is a compliance artifact with a per-system
  # retention story.
  prompt-log:
    name: oct-fleet-maintenance-prompt-log

  # 🔴 The LOCKED-1 database's storage. Named, so the rows survive a container
  # replace — which is the point, and also the obligation: what survives here is
  # visitor-typed case text under a retention promise AC-11's RoPA must state.
  # Deleting this volume is a data-erasure event, not a cleanup step.
  pgdata:
    name: oct-fleet-maintenance-pgdata
